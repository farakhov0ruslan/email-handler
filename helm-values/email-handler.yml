email-handler:
  enabled: true
  replicaCount: 1

  image:
    repository: "${DOCKER_IMAGE_REPOSITORY}"
    tag: "${DOCKER_IMAGE_TAG}"
    pullPolicy: Always

  securityContext:
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  service:
    enabled: true
    type: ClusterIP
    labels:
      monitoring.salestrigger/scrape: "true"
    ports:
      - name: metrics
        port: 9090
        targetPort: 9090
        protocol: TCP

  command: ["/bin/bash", "-c"]
  args:
    - "python app/email_handler/serve.py"

  envFromSecrets:
    - email-handler

  externalSecret:
    enabled: true
    name: email-handler
    refreshInterval: 1h
    secretStoreRef:
      name: vault-salestrigger
      kind: ClusterSecretStore
    dataFrom:
      - extract:
          key: ${SCOPE}/email-handler
      - extract:
          key: ${SCOPE}/.general
